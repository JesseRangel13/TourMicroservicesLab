receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 80
  batch:
    timeout: 5s
exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true # Plaintext OTLP on the isolated local lab network; no certificate validation is bypassed.
  debug:
    verbosity: basic
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
